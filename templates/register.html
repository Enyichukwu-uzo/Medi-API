{% extends "base.html" %}

{% block title %}
Register | Medi-API
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">

            <div class="brand-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>

            <h2>Create account</h2>

            <p>
                Register a new Medi-API account
            </p>

        </div>

        <div id="registerAlert"
             class="alert d-none"
             role="alert">
        </div>

        <form id="registerForm">

            <div class="mb-3">

                <label for="email" class="form-label">
                    Email address
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="you@example.com"
                        required>

                </div>

            </div>


            <div class="mb-3">

                <label for="password" class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Create a password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        id="toggleRegisterPassword">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>


            <div class="mb-4">

                <label for="confirmPassword" class="form-label">
                    Confirm password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-shield-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        minlength="6"
                        required>

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100 auth-submit"
                id="registerButton">

                <span id="registerButtonText">
                    Create Account
                </span>

                <span
                    id="registerSpinner"
                    class="spinner-border spinner-border-sm d-none"
                    role="status">
                </span>

            </button>

        </form>


        <div class="auth-footer">

            <span>
                Already have an account?
            </span>

            <a href="/login">
                Sign in
            </a>

        </div>

    </div>

</div>

{% endblock %}
