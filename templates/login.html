{% extends "base.html" %}
{% block title %}Login | Medi-API{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-icon">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <h2>Welcome back</h2>
            <p>Sign in to your Medi-API account</p>
        </div>
        <div id="loginAlert" class="alert d-none" role="alert">
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    <button type="button" class="btn btn-outline-secondary" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 auth-submit" id="loginButton">
                <span id="loginButtonText">Sign in</span>
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                </span>
            </button>
        </form>
        <div class="auth-footer">
            <span>Don't have an account?</span>
            <a href="/register">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
